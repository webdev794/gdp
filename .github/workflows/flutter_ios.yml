name: Flutter iOS build

# Builds the customer app (flutter_app/) for iPhone on a GitHub macOS runner.
# Run it from GitHub -> Actions -> "Flutter iOS build" -> Run workflow, or it
# runs on pushes to main / TSC_* branches that change the app.
# Outputs: TudeeShoppingCenter-simulator.zip (iPhone simulator build — upload to
# Appetize for demos, no Apple account needed) and an unsigned .ipa (installing
# on real iPhones / TestFlight needs an Apple Developer account and signing).

on:
  workflow_dispatch:
  push:
    branches: [ main, 'TSC_*' ]
    paths: [ 'flutter_app/**', '.github/workflows/flutter_ios.yml' ]

jobs:
  build-ios:
    name: Build iOS app (.ipa)
    runs-on: macos-14
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build unsigned IPA
        run: |
          flutter build ipa --no-codesign
          cd build/ios/archive/Runner.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qr "$GITHUB_WORKSPACE/TudeeShoppingCenter.ipa" Payload

      - name: Build for iPhone simulator (Appetize)
        run: |
          flutter build ios --simulator --debug
          cd build/ios/iphonesimulator
          zip -qr "$GITHUB_WORKSPACE/TudeeShoppingCenter-simulator.zip" Runner.app

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: TudeeShoppingCenter-iOS-simulator
          path: TudeeShoppingCenter-simulator.zip
          retention-days: 14

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TudeeShoppingCenter-iOS
          path: TudeeShoppingCenter.ipa
          retention-days: 14
