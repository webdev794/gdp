name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build iOS Archive & Package IPA
        run: |
          flutter build ipa --no-codesign
          mkdir -p "${GITHUB_WORKSPACE}/build/ios/ipa"
          cd build/ios/archive/Runner.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r "${GITHUB_WORKSPACE}/build/ios/ipa/Grocerly.ipa" Payload

      - name: Upload Grocerly IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grocerly-iOS-IPA
          path: build/ios/ipa/Grocerly.ipa
          retention-days: 14
